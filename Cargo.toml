[package]
name = "gpui-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Offline-first native design canvas for HTML/CSS artboards, built on GPUI Kit with MCP agent tools"
repository = "https://github.com/themixednuts/gpui-studio"
homepage = "https://github.com/themixednuts/gpui-studio"
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
ego-tree = "0.11"
gpui-kit = "=0.7.0"
# GPUI Kit runs on gpui-pre, so the bridge uses its gpui-pre backend.
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "3629692584c83cf1076c84ebb8146ce682edb2da", default-features = false, features = ["gpui-pre"] }
notify = "8.2.0"
ron = "0.12.2"
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
thiserror = "2.0.18"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "3629692584c83cf1076c84ebb8146ce682edb2da", default-features = false, features = ["gpui-pre", "test-support"] }

[patch.crates-io]
# gpui-mcp's patched gpui-pre adds the automation hooks the bridge needs
# (see its vendor/gpui/PATCHES.md). Pinned to the same tested commit.
gpui-pre = { git = "https://github.com/themixednuts/gpui-mcp", rev = "3629692584c83cf1076c84ebb8146ce682edb2da" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# UI projection and geometry code intentionally uses bounded numeric casts,
# long declarative registries, and string emitters. Keep the actionable Clippy
# baseline strict without turning every stylistic pedantic suggestion into CI noise.
pedantic = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Studio's primary authoring loop hot-reloads documents instead of recompiling
# Rust, so favor responsive debug binaries while preserving debuginfo and
# incremental compilation for native component development.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
lto = "thin"
strip = "symbols"
