name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xinput-dev libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
